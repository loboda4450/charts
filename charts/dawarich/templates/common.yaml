{{/* Preprocess values and prepare config file */}}
{{- define "dawarich.preprocess" -}}
{{- include "dawarich.validateSecrets" . }}

secrets:
  {{- include "dawarich.secrets" . | nindent 2 }}

service:
  http:
    type: ClusterIP
    controller: dawarich
    ports:
      http:
        port: 3000

controllers:
  dawarich:
    type: statefulset
    containers:
      dawarich:
        image:
          {{- toYaml .Values.image | nindent 10 }}
        command:
          - web-entrypoint.sh
        args:
          - bin/rails
          - server
          - -p
          - "3000"
          - -b
          - "::"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SETUID
              - SETGID
              - CHOWN
              - KILL
        env:
          {{- include "dawarich.env" (dict "root" . "role" "web") | nindent 10 }}
        envFrom:
          {{- include "dawarich.envFrom" . | nindent 10 }}
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health
                port: 3000
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health
                port: 3000
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health
                port: 3000
              # -- Database migrations are run by the entrypoint, so allow a long startup
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 60
      sidekiq:
        image:
          {{- toYaml .Values.image | nindent 10 }}
        command:
          - sidekiq-entrypoint.sh
        args:
          - sidekiq
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - SETUID
              - SETGID
              - CHOWN
              - KILL
        env:
          {{- include "dawarich.env" (dict "root" . "role" "sidekiq") | nindent 10 }}
        envFrom:
          {{- include "dawarich.envFrom" . | nindent 10 }}
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - pgrep
                  - -f
                  - sidekiq
              periodSeconds: 10
              timeoutSeconds: 10
              failureThreshold: 30
{{- end -}}

{{- $_ := merge .Values (include "dawarich.preprocess" . | fromYaml) -}}

{{/* Render the templates */}}
{{- include "bjw-s.common.loader.all" . }}
